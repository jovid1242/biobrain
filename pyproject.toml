[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "biobrain"
version = "0.1.0"
description = "Research: can the real Drosophila connectome seed an efficient, trainable, event-driven spiking architecture?"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "numpy>=2.0",      # compact numeric arrays, memmap
    "scipy>=1.13",     # sparse CSR/CSC, connected components, BFS
    "pyarrow>=16",     # reads the official Feather/CSV releases without pandas
    "psutil>=5.9",     # RSS / peak-RSS telemetry for the memory budget
]

[project.optional-dependencies]
analysis = [
    "python-igraph>=0.11",  # Leiden community detection (C core, no per-edge Python objects)
    "matplotlib>=3.8",      # distribution plots in reports
]
dev = ["pytest>=8"]

[project.scripts]
biobrain = "biobrain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
